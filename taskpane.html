<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Security: the pane may only load code from itself and Office, and only talk to Microsoft and Anthropic. See SECURITY.md. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.anthropic.com https://graph.microsoft.com https://login.microsoftonline.com https://appsforoffice.microsoft.com; frame-src https://login.microsoftonline.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoS Drafts</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="vendor/msal-browser.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<style>
  :root {
    --shell: #eef0f2; --card: #ffffff; --ink: #111111; --muted: #6b7076;
    --line: #e2e5e8; --chip: #f4f5f6; --err: #b42318; --ok: #067647;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; background: var(--shell); color: var(--ink);
    font: 13px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; }
  .head { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 10px; }
  .muted { color: var(--muted); font-size: 12px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .meta b { font-weight: 600; }
  .meta div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .note, .meta .files, .meta .files div { white-space: normal; overflow: visible; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .chip:hover { border-color: #b9bec4; }
  textarea, input {
    width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px;
    font: inherit; color: var(--ink); background: #fff; resize: vertical;
  }
  textarea:focus, input:focus { outline: 2px solid #11111122; border-color: #9aa0a6; }
  #instruction { min-height: 54px; }
  #draft { min-height: 220px; font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .btn {
    border: 0; border-radius: 999px; padding: 9px 16px; font: inherit; font-weight: 600;
    background: var(--ink); color: #fff; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn:disabled { opacity: .45; cursor: default; }
  .linkbtn { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline; }
  .status { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #ccc; border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .field { margin-bottom: 10px; }
  .files { margin-top: 8px; font-size: 12px; }
  .files div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-top: 1px solid var(--line); }
  .files div:first-child { border-top: 0; }
  .links a { color: var(--ink); word-break: break-all; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  #styleRules { min-height: 180px; font-size: 12px; }
</style>
</head>
<body>
  <div class="head">
    <h1>CoS Drafts</h1>
    <button class="linkbtn" id="toggleSettings">Settings</button>
  </div>

  <!-- Settings -->
  <div class="card hidden" id="settingsCard">
    <div class="label">Settings (saved in your mailbox)</div>
    <div class="field">
      <label for="apiKey">Anthropic API key</label>
      <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
    </div>
    <div class="field">
      <label for="model">Model</label>
      <input id="model" type="text">
    </div>
    <div class="field">
      <label for="clientId">Microsoft Entra app (client) ID: calendar, full thread, attachments</label>
      <input id="clientId" type="text" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off">
    </div>
    <div class="field">
      <label><input id="useCalendar" type="checkbox" style="width:auto;margin-right:6px">Use my calendar for time slots</label>
      <label><input id="useAttachments" type="checkbox" style="width:auto;margin-right:6px">Read attachments in the thread (PDF, images, Word, PowerPoint, Excel)</label>
      <button class="linkbtn" id="testCalendar" type="button">Test connection</button>
      <div class="status" id="calStatus"></div>
    </div>
    <div class="field">
      <label for="calendly">Calendly link</label>
      <input id="calendly" type="text">
    </div>
    <div class="field">
      <label for="styleRules">Style rules (paste CoS Coach rules here)</label>
      <textarea id="styleRules"></textarea>
    </div>
    <div class="row">
      <button class="btn" id="saveSettings">Save</button>
      <button class="btn ghost" id="resetStyle">Reset style rules</button>
    </div>
    <div class="status" id="settingsStatus"></div>
  </div>

  <!-- Mail context -->
  <div class="card meta" id="metaCard">
    <div class="label" id="modeLabel">Replying to</div>
    <div><b id="metaFrom">…</b></div>
    <div class="muted" id="metaSubject">Loading mail…</div>
    <div class="note" id="ctxSummary"></div>
    <div class="files" id="attList"></div>
    <div class="note links" id="linkList"></div>
  </div>

  <!-- Instruction -->
  <div class="card">
    <div class="label">What should the reply say? (optional)</div>
    <div class="chips" id="chips"></div>
    <textarea id="instruction" placeholder="e.g. Zusagen, Dienstag 14 Uhr passt. Deck bitte vorab schicken."></textarea>
    <div class="row" style="margin-top:8px">
      <label class="chip" for="fileInput" id="dropZone">+ Add file (e.g. deck PDF from DocSend)</label>
      <input type="file" id="fileInput" multiple class="hidden" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.docx,.pptx,.xlsx,.txt,.csv,.md">
    </div>
    <div class="files" id="manualList"></div>
    <div class="row">
      <button class="btn" id="generate">Draft reply</button>
    </div>
    <div class="status" id="genStatus"></div>
  </div>

  <!-- Result -->
  <div class="card hidden" id="resultCard">
    <div class="label">Draft (edit freely)</div>
    <textarea id="draft"></textarea>
    <div class="row" id="readActions">
      <button class="btn" id="openReply">Open as reply</button>
      <button class="btn ghost" id="openReplyAll">Reply all</button>
      <button class="btn ghost" id="copy">Copy</button>
    </div>
    <div class="row hidden" id="composeActions">
      <button class="btn" id="insert">Insert into mail</button>
      <button class="btn ghost" id="copy2">Copy</button>
    </div>
    <div class="status" id="resultStatus"></div>
  </div>

<script src="taskpane.js"></script>
</body>
</html>
